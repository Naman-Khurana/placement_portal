{% macro render_table( headers,title=None) %}


<div>
    {% if title %}
        <h3>{{title}}</h2>
    {% endif %}

    <table class="table table-bordered">
        <thead class="table-light">
            <tr>
                {% for header in headers %}
                    <th>{{ header }}</th>
                {% endfor %}
            </tr>
        </thead>

        <tbody>
            {{ caller() }}
        </tbody>
    </table>
</div>

{% endmacro %}
